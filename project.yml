name: YFTVBox
options:
  bundleIdPrefix: me.bsdnme
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  YFTVBox:
    type: application
    platform: iOS
    sources:
      - path: YFTVBox
        excludes:
          - "Info.plist"
    info:
      path: YFTVBox/Info.plist
      properties:
        CFBundleDisplayName: 飞哥影视仓
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 源站大量是 http://，且播放地址带自定义 Referer / UA。
        # 自签或 TestFlight 分发下这是必须的；上架时会被追问，属于产品形态问题而非代码问题。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.bsdnme.tvbox
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    scheme:
      testTargets:
        - YFTVBoxTests
        - YFTVBoxUITests
      gatherCoverageData: true

  YFTVBoxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YFTVBoxUITests
    dependencies:
      - target: YFTVBox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.bsdnme.tvbox.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: YFTVBox

  YFTVBoxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YFTVBoxTests
    dependencies:
      - target: YFTVBox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.bsdnme.tvbox.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/YFTVBox.app/YFTVBox
        BUNDLE_LOADER: $(TEST_HOST)
