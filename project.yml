name: YFTVBox
options:
  bundleIdPrefix: me.bsdnme
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  YFTVBox:
    type: application
    platform: iOS
    sources:
      - path: YFTVBox
        excludes:
          - "Info.plist"
    info:
      path: YFTVBox/Info.plist
      properties:
        CFBundleDisplayName: 飞哥影视仓
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 源站大量是 http://，且播放地址带自定义 Referer / UA。
        # 自签或 TestFlight 分发下这是必须的；上架时会被追问，属于产品形态问题而非代码问题。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
        NSLocalNetworkUsageDescription: 用于访问局域网内的视频源与投屏设备
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.bsdnme.tvbox
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
